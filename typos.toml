[files]
extend-exclude = [
  "**/*.app/",
  ".claude/cache/",
  ".claude/plans/",
  ".claude/plugins/",
  ".claude/projects/",
  ".claude/shell-snapshots/",
  ".claude/todos/",
  ".config/karabiner/",
  ".config/wezterm/colors/NocturnalZone.toml",
  ".config/zed/themes/nocturnalzone.json",
  ".codex/cache/",
  # 保持中の旧履歴は通常コードの検査対象へ戻さない。
  "aidlc/spaces/",
  "artifacts/",
  "contrib/",
  "node_modules/",
  "pipedream/html/",
  "Vendor/",
]

[default]
check-filename = true
check-file = true
extend-ignore-re = ["[0-9a-f]{7,40}"]

[default.extend-identifiers]
ND = "ND"
# Xcodeテーマの実キー名。Apple側の綴りが"Exectuable"のため修正できない。
DVTConsoleExectuableInputTextColor = "DVTConsoleExectuableInputTextColor"
DVTConsoleExectuableOutputTextColor = "DVTConsoleExectuableOutputTextColor"

[default.extend-words]
Relace = "Relace"
reviewr = "reviewr"
runn = "runn"

# 人が保守する同名の固定oracleだけの記号列。通常語と別名fileの検査は維持する。
[type.rcs-oracle]
extend-glob = ["refinement-semantic-oracles-v1.json"]

[type.rcs-oracle.extend-identifiers]
ba = "ba"
BA = "BA"

# golang.org/x/oauth2@v0.35.0の照合済みSumに由来するregexの表記だけを扱う。
# typos --identifiersで確認した分割後の識別子1件に限定し、通常語は許可しない。
[type.gitleaks-public-sum]
extend-glob = ["gitleaks-default.toml"]

[type.gitleaks-public-sum.extend-identifiers]
bkyWXIHMfhNdJAdwW3FuWeCPYN5GVQ = "bkyWXIHMfhNdJAdwW3FuWeCPYN5GVQ"
