name: Treefmt

on:
  workflow_call:

jobs:
  treefmt-non-swift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Checkout guardrails
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: noxyzone/guardrails
          path: .guardrails
          persist-credentials: false

      - name: Install tools
        env:
          GH_TOKEN: ${{ github.token }}
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          set -euo pipefail

          treefmt_tmp="$(mktemp -d)"
          mkdir -p "$PIPX_BIN_DIR"
          gh release download v2.5.0 --repo numtide/treefmt --pattern treefmt_2.5.0_linux_amd64.tar.gz --output "$treefmt_tmp/treefmt.tar.gz"
          printf '%s  %s\n' '95f707bf9666d08b50888b116768fd77f042ad5af92aa3b795f063160e72758f' "$treefmt_tmp/treefmt.tar.gz" | sha256sum --check --strict
          tar xzf "$treefmt_tmp/treefmt.tar.gz" -C "$treefmt_tmp"
          sudo install "$treefmt_tmp/treefmt" /usr/local/bin/treefmt
          gh release download v3.13.1 --repo mvdan/sh --pattern shfmt_v3.13.1_linux_amd64 --output "$treefmt_tmp/shfmt"
          printf '%s  %s\n' 'fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1' "$treefmt_tmp/shfmt" | sha256sum --check --strict
          sudo install "$treefmt_tmp/shfmt" /usr/local/bin/shfmt
          gh release download 0.10.0 --repo tamasfe/taplo --pattern taplo-linux-x86_64.gz --output "$treefmt_tmp/taplo.gz"
          printf '%s  %s\n' '8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156' "$treefmt_tmp/taplo.gz" | sha256sum --check --strict
          gzip -d "$treefmt_tmp/taplo.gz"
          sudo install "$treefmt_tmp/taplo" /usr/local/bin/taplo
          pipx install ruff==0.15.22
          npm ci --prefix .guardrails/.github/quality-gates --ignore-scripts

      - name: Verify shared formatter config links
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .swiftformat >/dev/null 2>&1; then
            echo "::error file=.swiftformat::.swiftformat must not be tracked. Shared SwiftFormat config is provided by noxyzone/guardrails."
            exit 1
          fi

      - name: Run Treefmt
        run: |
          set -euo pipefail

          export PATH="$RUNNER_TEMP/pipx-bin:$GITHUB_WORKSPACE/.guardrails/.github/quality-gates/node_modules/.bin:/usr/local/bin:/usr/bin:/bin"
          .guardrails/scripts/treefmt-check.sh --check --without-swiftformat --repo "$GITHUB_WORKSPACE"

  swiftformat:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false

      - name: Checkout guardrails
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          repository: noxyzone/guardrails
          path: .guardrails
          persist-credentials: false

      - name: Install SwiftFormat
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFT_TOOLS_BIN: ${{ runner.temp }}/swift-tools-bin
        run: |
          set -euo pipefail

          swiftformat_tmp="$(mktemp -d)"
          mkdir -p "$SWIFT_TOOLS_BIN"
          gh release download 0.61.1 --repo nicklockwood/SwiftFormat --pattern swiftformat.zip --output "$swiftformat_tmp/swiftformat.zip"
          printf '%s  %s\n' 'b990400779aceb7d7020796eb9ba814d4480543f671d38fc0ff48cb72f04c584' "$swiftformat_tmp/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$swiftformat_tmp/swiftformat.zip" -d "$swiftformat_tmp/swiftformat"
          install "$swiftformat_tmp/swiftformat/swiftformat" "$SWIFT_TOOLS_BIN/swiftformat"
          printf '%s\n' "$SWIFT_TOOLS_BIN" >> "$GITHUB_PATH"
          [[ "$("$SWIFT_TOOLS_BIN/swiftformat" --version)" == "0.61.1" ]]

      - name: Verify shared formatter config links
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .swiftformat >/dev/null 2>&1; then
            echo "::error file=.swiftformat::.swiftformat must not be tracked. Shared SwiftFormat config is provided by noxyzone/guardrails."
            exit 1
          fi

      - name: Run SwiftFormat
        run: |
          set -euo pipefail

          export PATH="$RUNNER_TEMP/swift-tools-bin:/usr/bin:/bin"
          swift_files="$(git ls-files '*.swift' ':!:DerivedData/**' ':!:.build/**' ':!:build/**')"
          if [ -n "$swift_files" ]; then
            printf '%s\n' "$swift_files" | xargs swiftformat --lint --config .guardrails/.swiftformat
          fi

  treefmt:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - treefmt-non-swift
      - swiftformat
    permissions:
      contents: read

    steps:
      - name: Confirm formatter jobs
        run: |
          set -euo pipefail

          if [[ "${{ needs.treefmt-non-swift.result }}" != "success" ]]; then
            echo "::error::treefmt-non-swift job did not succeed"
            exit 1
          fi
          if [[ "${{ needs.swiftformat.result }}" != "success" ]]; then
            echo "::error::swiftformat job did not succeed"
            exit 1
          fi
          echo "Treefmt and SwiftFormat checks completed"
