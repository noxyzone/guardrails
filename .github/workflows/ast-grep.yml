name: ast-grep

on:
  workflow_call:

jobs:
  ast-grep:
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout guardrails
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          repository: noxyzone/guardrails
          ref: main
          path: .guardrails

      - name: Install ast-grep
        run: brew install ast-grep

      - name: Run ast-grep
        run: |
          swift_files="$(git ls-files '*.swift')"
          if [ -n "$swift_files" ]; then
            printf '%s\n' "$swift_files" | xargs ast-grep scan --config .guardrails/sgconfig.yml --report-style short
          fi
